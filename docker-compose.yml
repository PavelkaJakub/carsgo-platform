services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carsgo
      POSTGRES_USER: carsgo
      POSTGRES_PASSWORD: carsgo
    volumes:
      - carsgo_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    depends_on:
      - db
    env_file: .env
    ports:
      - "3000:3000"
volumes:
  carsgo_pg:
